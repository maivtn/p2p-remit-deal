<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">

<title>Tài khoản nhận</title>
</head>
<body data-active-tab="beneficiaryAccounts">
<div class="container">
<div class="app-shell">

  <div class="tabs-wrap">
    <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
  </div>

  <section class="overview-intro d-flex flex-column flex-lg-row align-items-start justify-content-between gap-3 mb-3 mt-3">
    <div>
      <h1 class="overview-title">Tài khoản nhận</h1>

    <div class="overview-actions d-flex align-items-center gap-2">
      <button class="btn btn-primary" data-account-modal data-mode="add"><i class="bi bi-plus"></i> Thêm</button>
    </div>
  </section>
  <main class="app-page">
    <div class="account-chip-row" id="accountCurrencyFilters"></div>
    <div id="accountsList"></div>
  </main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
