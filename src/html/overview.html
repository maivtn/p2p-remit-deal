<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<title>Overview</title>
</head>
<body data-active-tab="overview">
<div class="app-shell">

  <main class="app-page flush-top">
    <section class="hero">
      <div class="hero-kicker">Overview</div>
      <h1 class="hero-title">Tổng quan hoạt động</h1>
      <div class="row g-3">
        <div class="col-6">
          <div class="hero-card">
            <div class="label">Đang xử lý</div>
            <div class="value">4</div>
          </div>
        </div>
        <div class="col-6">
          <div class="hero-card">
            <div class="label">Chờ chấp nhận</div>
            <div class="value">2</div>
          </div>
        </div>
      </div>
    </section>

    <section class="px-1">
      <h2 class="section-title">Giao dịch đang xử lý</h2>
      <p class="section-caption">Ưu tiên các giao dịch đang xử lý và deal chờ chấp nhận</p>
      <div id="processingList"></div>

      <h2 class="section-title">Deal nổi bật</h2>
      <p class="section-caption">Danh sách deal nổi bật có thể xem và kết nối ngay</p>
      <div id="hotDeals"></div>

      <h2 class="section-title">Lịch sử gần đây</h2>
      <p class="section-caption">Các kết nối giao dịch gần nhất</p>
      <div id="recentHistory"></div>
    </section>
  </main>

  <div class="tabs-wrap">
    <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/overview.js"></script>
</body>
</html>
