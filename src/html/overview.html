<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<title>Overview</title>
</head>
<body data-active-tab="overview">
<div class="app-shell overview-shell">

  <div class="tabs-wrap">
    <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
  </div>

  <main class="app-page overview-page">
    <section class="overview-intro">
      <div>
        <h1 class="overview-title">Tổng quan hoạt động</h1>
        <p class="overview-subtitle">Theo dõi giao dịch, deal nổi bật và lịch sử giao dịch gần đây</p>
      </div>
      <div class="overview-actions">
        <a class="btn overview-btn overview-btn-outline" href="search-deal.html"><i class="bi bi-search"></i> Tìm deal</a>
        <a class="btn overview-btn overview-btn-primary" href="create-deal.html"><i class="bi bi-plus-lg"></i> Tạo deal</a>
      </div>
    </section>

    <section class="overview-metrics" id="overviewMetrics" aria-label="Chỉ số tổng quan"></section>

    <section class="overview-grid">
      <div class="overview-main-col">
        <section class="overview-panel processing-panel">
          <div class="overview-section-head">
            <h2 class="overview-section-title">Đang xử lý</h2>
          </div>
          <div id="processingList" class="processing-list"></div>
        </section>

        <section class="overview-panel deal-highlight-panel">
          <div class="overview-section-head">
            <h2 class="overview-section-title">Deal nổi bật</h2>
            <a class="overview-section-link" href="search-deal.html">Xem tất cả deal <i class="bi bi-chevron-right"></i></a>
          </div>
          <div id="hotDeals"></div>
        </section>
      </div>

      <aside class="overview-side-col">
        <section class="overview-panel market-panel">
          <div class="overview-section-head">
            <h2 class="overview-section-title">Market snapshot</h2>
            <button class="overview-range-btn" type="button">7 ngày qua <i class="bi bi-chevron-down"></i></button>
          </div>
          <div id="marketSnapshot"></div>
        </section>

        <section class="overview-panel recent-history-panel">
          <div class="overview-section-head">
            <h2 class="overview-section-title">Lịch sử giao dịch gần đây</h2>
          </div>
          <div id="recentHistory" class="recent-history-list"></div>
        </section>
      </aside>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/overview.js"></script>
</body>
</html>
