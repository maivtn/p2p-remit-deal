<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
  <link href="assets/css/app.css" rel="stylesheet">
  <title>Overview</title>
</head>

<body data-active-tab="overview">
  <div class="container">


    <div class="app-shell">

      <div class="tabs-wrap">
        <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
      </div>

      <main class="app-page overview-page container-fluid p-0">
        <section
          class="overview-intro d-flex flex-column flex-lg-row align-items-start justify-content-between gap-3 mb-4 mt-3">
          <div>
            <h1 class="overview-title">Tổng quan hoạt động</h1>
            <p class="overview-subtitle">Theo dõi giao dịch, deal nổi bật và lịch sử giao dịch gần đây</p>
          </div>
          <div class="overview-actions d-flex align-items-center gap-2">
            <a class="btn btn-outline-primary" href="search-deal.html"><i class="bi bi-search"></i> Tìm
              deal</a>
            <a class="btn btn-primary" href="create-deal.html"><i class="bi bi-plus-lg"></i> Tạo
              deal</a>
          </div>
        </section>

        <section class="overview-content-grid row g-3 g-md-5 align-items-start">
          <div class="overview-main-col col-12 col-xl-8 d-flex flex-column gap-3">
            <section class="overview-panel processing-panel">
              <!-- <div class="d-flex align-items-center justify-content-between gap-2">
                <h2 class="overview-section-title">Đang xử lý</h2>
                <a class="btn btn-link overview-section-link p-0" href="history.html">Xem tất cả <i class="bi bi-chevron-right"></i></a>
              </div> -->
              <div class="card-body p-0">
                <div id="processingList" class="processing-list"></div>
              </div>
            </section>

            <section class=" overview-panel deal-highlight-panel">
              <div
                class="d-flex align-items-center justify-content-between gap-2 mb-3 mt-2">
                <h2 class="overview-section-title">Deal nổi bật</h2>
                <a class="btn btn-link btn-sm text-decoration-none" href="search-deal.html">Tìm deal <i
                    class="bi bi-arrow-right"></i></a>
              </div>
              <div class="card-body p-0" id="hotDeals"></div>
            </section>
          </div>

          <aside class="overview-side-col col-12 col-xl-4 d-flex flex-column gap-3">
            <section class="overview-metrics" id="overviewMetrics" aria-label="Chỉ số tổng quan"></section>

            <section class=" overview-panel recent-history-panel mt-3">
             <h2 class="overview-section-title">Lịch sử giao dịch gần đây</h2>
              <div class="recent-history-list" id="recentHistory"></div>
            </section>
          </aside>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/overview.js"></script>
</body>

</html>
