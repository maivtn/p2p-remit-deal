<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P-16 · Deals của tôi — P2P Remit Deals</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    body { background: var(--color-cloud); }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--color-pebble);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner { display: flex; align-items: center; gap: 12px; }

    /* Bottom nav */

    /* Filter tabs */
    .filter-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: var(--radius-buttons);
      border: 1.5px solid var(--color-pebble);
      background: #fff; color: var(--color-slate);
      font-size: 13px; font-weight: 500; cursor: pointer;
      white-space: nowrap; transition: all 0.15s;
    }
    .filter-tab.active {
      border-color: var(--color-monday-violet);
      background: var(--color-periwinkle);
      color: var(--color-monday-violet);
    }

    /* Deal card */
    .deal-card {
      background: #fff;
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-mist);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .deal-card-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .deal-card-body { padding: 0 16px 12px; }
    .deal-card-footer {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--color-pebble);
      display: flex;
      gap: 8px;
    }

    /* corridor display */
    .corridor-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .corridor-flags { font-size: 18px; line-height: 1; }

    /* Deal stat rows */
    .deal-stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--color-slate);
      margin-bottom: 5px;
    }
    .deal-stat-row strong { color: var(--color-ink); }

    /* Method chips */
    .method-chip-sm {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--color-cloud); border-radius: var(--radius-buttons);
      padding: 3px 10px; font-size: 12px; color: var(--color-slate);
      white-space: nowrap;
    }
    .method-chips-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }

    /* badges */
    .badge-deal-active {
      background: var(--color-mint); color: var(--color-forest);
      border-radius: var(--radius-badges); padding: 3px 10px;
      font-size: 12px; font-weight: 500;
    }
    .badge-deal-paused {
      background: var(--color-lavender); color: #9450fd;
      border-radius: var(--radius-badges); padding: 3px 10px;
      font-size: 12px; font-weight: 500;
    }
    .badge-deal-expired {
      background: #fef3c7; color: #92400e;
      border-radius: var(--radius-badges); padding: 3px 10px;
      font-size: 12px; font-weight: 500;
    }
    .badge-deal-deleted {
      background: var(--color-danger-bg); color: var(--color-danger);
      border-radius: var(--radius-badges); padding: 3px 10px;
      font-size: 12px; font-weight: 500;
    }

    /* btn-sm override */
    .btn-sm-pill {
      padding: 6px 16px;
      font-size: 13px;
      border-radius: var(--radius-buttons) !important;
      font-weight: 500;
      border: 1.5px solid;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-iron);
    }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; opacity: 0.35; }
    .empty-state p { font-size: 15px; margin: 0; }

    /* request count chip */
    .req-count-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--color-periwinkle); color: var(--color-monday-violet);
      border-radius: var(--radius-buttons); padding: 2px 10px;
      font-size: 11px; font-weight: 600;
    }
  </style>
</head>
<body>

<!-- Topbar -->
<nav class="topbar">
  <div class="container-sm">
    <div class="topbar-inner">
      <div class="d-flex align-items-center gap-2 flex-grow-1">
        <div style="width:32px;height:32px;background:var(--color-periwinkle);border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <i class="bi bi-grid-fill" style="color:var(--color-monday-violet);font-size:16px;"></i>
        </div>
        <span style="font-size:16px;font-weight:700;color:var(--color-ink);">Deals của tôi</span>
      </div>
      <a href="p-17-create-deal.html" class="btn btn-primary d-flex align-items-center gap-1" style="padding:7px 16px;font-size:13px;font-weight:600;">
        <i class="bi bi-plus-lg"></i> Tạo mới
      </a>
    </div>
  </div>
</nav>

<!-- Filter tabs -->
<div class="container-sm py-3">
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab" data-filter="all" onclick="setFilter('all',this)">Tất cả <span class="badge bg-secondary ms-1" style="font-size:10px;" id="cnt-all">4</span></button>
    <button class="filter-tab active" data-filter="active" onclick="setFilter('active',this)">Hoạt động <span class="badge ms-1" style="font-size:10px;background:var(--color-mint);color:var(--color-forest);" id="cnt-active">2</span></button>
    <button class="filter-tab" data-filter="paused" onclick="setFilter('paused',this)">Tạm dừng <span class="badge ms-1" style="font-size:10px;background:var(--color-lavender);color:#9450fd;" id="cnt-paused">1</span></button>
    <button class="filter-tab" data-filter="expired" onclick="setFilter('expired',this)">Hết hạn</button>
    <button class="filter-tab" data-filter="deleted" onclick="setFilter('deleted',this)">Đã xóa</button>
  </div>
</div>

<!-- Deal list -->
<div class="container-sm pb-3" id="dealList">
  <!-- Rendered by JS -->
</div>

<!-- Empty state (hidden by default) -->
<div class="container-sm" id="emptyState" style="display:none;">
  <div class="empty-state">
    <i class="bi bi-grid"></i>
    <p>Bạn chưa có deal nào.</p>
    <a href="p-17-create-deal.html" class="btn btn-primary mt-3">+ Tạo deal đầu tiên</a>
  </div>
</div>

<!-- Toast -->

<!-- Bottom nav -->

<script src="mock-data.js"></script>
  <script src="components.js"></script>
<script>
  // ── Deal data for U-PRV-001 ──────────────────────────────
  const MY_PROVIDER_ID = 'U-PRV-001';

  // Build local deal list including a fake "deleted" entry
  const dealsData = [
    {
      ...P2P_DATA.getDeal('DEAL-001'),
      requestCount: 4,
      expiresAt: '2026-06-30',
    },
    {
      ...P2P_DATA.getDeal('DEAL-003'),
      requestCount: 1,
      expiresAt: '2026-06-25',
    },
    {
      // Fake "paused" demo entry from DEAL-001 data, different ID
      id: 'DEAL-001-P',
      versionId: 'DEAL-001P-v1',
      providerId: MY_PROVIDER_ID,
      corridor: { sendCurrency: 'USD', receiveCurrency: 'SGD' },
      rate: 1.34,
      minAmount: 500,
      maxAmount: 10000,
      methods: ['zelle', 'venmo'],
      payoutMethods: ['bank-transfer'],
      status: 'paused',
      requestCount: 0,
      expiresAt: '2026-07-15',
      rating: 4.9,
      completedCount: 0,
      onTimeRate: 100,
      slaHours: 4,
    },
    {
      // Fake "deleted" demo entry
      id: 'DEAL-DEL-1',
      versionId: 'DEAL-DEL-1-v2',
      providerId: MY_PROVIDER_ID,
      corridor: { sendCurrency: 'USD', receiveCurrency: 'VND' },
      rate: 25200,
      minAmount: 50,
      maxAmount: 2000,
      methods: ['paypal'],
      payoutMethods: ['momo'],
      status: 'deleted',
      requestCount: 2,
      expiresAt: '2026-05-01',
      rating: 4.8,
      completedCount: 12,
      onTimeRate: 97,
      slaHours: 6,
      deletedAt: '2026-05-02',
    },
  ];

  // Patch in real mock-data methods
  dealsData.forEach(d => {
    if (!d.payoutMethods) {
      d.payoutMethods = ['momo', 'zalopay', 'bank-transfer'];
    }
  });

  let currentFilter = 'active';

  // ── Helpers ──────────────────────────────────────────────
  function getCorridorLabel(deal) {
    const s = P2P_DATA.CURRENCIES ? P2P_DATA.CURRENCIES.find(c => c.code === deal.corridor.sendCurrency) : null;
    const r = P2P_DATA.CURRENCIES ? P2P_DATA.CURRENCIES.find(c => c.code === deal.corridor.receiveCurrency) : null;
    const CURRENCIES = [
      { code: 'USD', flag: '🇺🇸' },
      { code: 'VND', flag: '🇻🇳' },
      { code: 'SGD', flag: '🇸🇬' },
      { code: 'JPY', flag: '🇯🇵' },
      { code: 'EUR', flag: '🇪🇺' },
    ];
    const sf = CURRENCIES.find(c => c.code === deal.corridor.sendCurrency);
    const rf = CURRENCIES.find(c => c.code === deal.corridor.receiveCurrency);
    return {
      from: deal.corridor.sendCurrency,
      to: deal.corridor.receiveCurrency,
      fromFlag: sf ? sf.flag : '',
      toFlag: rf ? rf.flag : '',
    };
  }

  function getRateDisplay(deal) {
    const s = deal.corridor.sendCurrency;
    const r = deal.corridor.receiveCurrency;
    if (r === 'VND') {
      return `${P2P_DATA.formatVND(deal.rate)} / ${s}`;
    }
    if (s === 'VND') {
      return `${P2P_DATA.formatVND(deal.rate)} / USD`;
    }
    return `${deal.rate} ${r}/${s}`;
  }

  function getMinMaxDisplay(deal) {
    const s = deal.corridor.sendCurrency;
    if (s === 'USD') return `$${deal.minAmount.toLocaleString()} – $${deal.maxAmount.toLocaleString()}`;
    if (s === 'VND') return `${P2P_DATA.formatVND(deal.minAmount)} – ${P2P_DATA.formatVND(deal.maxAmount)}`;
    return `${deal.minAmount} – ${deal.maxAmount} ${s}`;
  }

  function getBadgeHtml(deal) {
    const st = deal.status;
    if (st === 'active')  return `<span class="badge-deal-active"><i class="bi bi-circle-fill" style="font-size:7px;"></i> Hoạt động</span>`;
    if (st === 'paused')  return `<span class="badge-deal-paused"><i class="bi bi-pause-fill" style="font-size:9px;"></i> Tạm dừng</span>`;
    if (st === 'expired') return `<span class="badge-deal-expired"><i class="bi bi-clock" style="font-size:9px;"></i> Hết hạn</span>`;
    if (st === 'deleted') return `<span class="badge-deal-deleted"><i class="bi bi-trash" style="font-size:9px;"></i> Đã xóa</span>`;
    return `<span class="badge-status badge-pending">${st}</span>`;
  }

  function renderMethodChips(methods) {
    if (!methods || methods.length === 0) return '<span class="text-muted" style="font-size:12px;">—</span>';
    return methods.map(m =>
      `<span class="method-chip-sm">${P2P_DATA.getMethodIcon(m)} ${P2P_DATA.getMethodLabel(m)}</span>`
    ).join('');
  }

  function renderDealCard(deal) {
    const c = getCorridorLabel(deal);
    const isDeleted = deal.status === 'deleted';
    const isPaused  = deal.status === 'paused';
    const isActive  = deal.status === 'active';
    const pauseBtn = isActive
      ? `<button class="btn-sm-pill btn" style="border-color:var(--color-pebble);color:var(--color-slate);background:#fff;" onclick="togglePause('${deal.id}',this)"><i class="bi bi-pause-fill"></i> Tạm dừng</button>`
      : isPaused
      ? `<button class="btn-sm-pill btn" style="border-color:var(--color-monday-violet);color:var(--color-monday-violet);background:var(--color-periwinkle);" onclick="togglePause('${deal.id}',this)"><i class="bi bi-play-fill"></i> Khôi phục</button>`
      : '';

    const detailBtn = !isDeleted
      ? `<a href="p-18-deal-detail.html" class="btn-sm-pill btn btn-primary">Chi tiết</a>`
      : `<button class="btn-sm-pill btn" style="border-color:var(--color-pebble);color:var(--color-iron);background:#fff;" disabled>Đã xóa</button>`;

    const expiryRow = deal.expiresAt
      ? `<div class="deal-stat-row"><i class="bi bi-calendar2-check" style="color:var(--color-iron);font-size:13px;"></i> Hết hạn: <strong>${formatDate(deal.expiresAt)}</strong></div>`
      : '';

    const reqChip = deal.requestCount > 0
      ? `<span class="req-count-chip"><i class="bi bi-arrow-left-right" style="font-size:10px;"></i> ${deal.requestCount} yêu cầu</span>`
      : '';

    const deletedBanner = isDeleted
      ? `<div style="background:var(--color-danger-bg);border-left:3px solid var(--color-danger);border-radius:var(--radius-nav);padding:8px 12px;font-size:12px;color:var(--color-danger);margin-bottom:8px;">
          <i class="bi bi-trash3"></i> Deal đã xóa ngày ${deal.deletedAt ? formatDate(deal.deletedAt) : '—'}
        </div>`
      : '';

    return `
      <div class="deal-card" id="deal-card-${deal.id}" style="${isDeleted ? 'opacity:0.7;' : ''}">
        <div class="deal-card-header">
          <div class="flex-grow-1">
            <div class="corridor-label mb-1">
              <span class="corridor-flags">${c.fromFlag}</span>
              <span>${c.from}</span>
              <i class="bi bi-arrow-right" style="font-size:13px;color:var(--color-iron);"></i>
              <span class="corridor-flags">${c.toFlag}</span>
              <span>${c.to}</span>
            </div>
            ${getBadgeHtml(deal)}
          </div>
          ${reqChip}
        </div>
        <div class="deal-card-body">
          ${deletedBanner}
          <div class="deal-stat-row">
            <i class="bi bi-graph-up" style="color:var(--color-monday-violet);font-size:13px;"></i>
            Tỷ giá: <strong id="rate-label-${deal.id}">${getRateDisplay(deal)}</strong>
          </div>
          <div class="deal-stat-row">
            <i class="bi bi-arrows-expand-vertical" style="color:var(--color-iron);font-size:13px;"></i>
            Giới hạn: <strong>${getMinMaxDisplay(deal)}</strong>
          </div>
          ${expiryRow}
          <div class="mb-1 mt-2">
            <div class="section-label mb-1">Nhận qua</div>
            <div class="method-chips-row">${renderMethodChips(deal.methods)}</div>
          </div>
          <div class="mt-2">
            <div class="section-label mb-1">Chi trả qua</div>
            <div class="method-chips-row">${renderMethodChips(deal.payoutMethods)}</div>
          </div>
        </div>
        <div class="deal-card-footer">
          ${pauseBtn}
          ${detailBtn}
        </div>
      </div>
    `;
  }

  function formatDate(iso) {
    const d = new Date(iso + (iso.length === 10 ? 'T00:00:00Z' : ''));
    return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderList();
  }

  function renderList() {
    const list = document.getElementById('dealList');
    const empty = document.getElementById('emptyState');
    let filtered;
    if (currentFilter === 'all') {
      filtered = dealsData;
    } else {
      filtered = dealsData.filter(d => d.status === currentFilter);
    }
    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.style.display = '';
    } else {
      empty.style.display = 'none';
      list.innerHTML = filtered.map(renderDealCard).join('');
    }
  }

  function togglePause(dealId, btn) {
    const deal = dealsData.find(d => d.id === dealId);
    if (!deal) return;
    const card = document.getElementById('deal-card-' + dealId);
    if (deal.status === 'active') {
      deal.status = 'paused';
      showToast('Deal đã tạm dừng');
    } else if (deal.status === 'paused') {
      deal.status = 'active';
      showToast('Deal đã khôi phục');
    }
    // Re-render just this card
    renderList();
  }


  // Init
  renderList();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script>P2P_COMPONENTS.renderBottomNav('deals');</script>
</body>
</html>
