<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S-29 · Thêm người thụ hưởng — P2P Remit Deals</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    body { background: var(--color-cloud); }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--color-pebble);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner { display: flex; align-items: center; gap: 12px; }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-slate);
      margin-bottom: 6px;
    }
    .form-control, .form-select {
      border: 1.5px solid var(--color-pebble) !important;
      border-radius: 12px !important;
      font-size: 15px;
      padding: 12px 14px;
      color: var(--color-ink);
      background: #fff;
      transition: border-color 0.15s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--color-monday-violet) !important;
      box-shadow: 0 0 0 3px rgba(97,97,255,0.12) !important;
    }
    .form-control.is-invalid {
      border-color: var(--color-danger) !important;
    }

    .sticky-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--color-pebble);
      padding: 12px 16px;
      z-index: 200;
    }

    .required-star { color: var(--color-danger); margin-left: 2px; }

    .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <nav class="topbar">
    <div class="container-sm">
      <div class="topbar-inner">
        <a href="s-27-beneficiaries.html" class="btn btn-link p-0 text-decoration-none" style="color:var(--color-ink);">
          <i class="bi bi-arrow-left" style="font-size:20px;"></i>
        </a>
        <span style="font-weight:600; font-size:16px; color:var(--color-ink);">Thêm người thụ hưởng</span>
      </div>
    </div>
  </nav>

  <!-- FORM -->
  <div class="container-sm py-3" style="max-width:480px;">
    <form id="beneficiary-form" novalidate>
      <div class="d-flex flex-column gap-3">

        <!-- 1. Tiền tệ nhận -->
        <div>
          <label class="form-label" for="currency">
            Tiền tệ nhận <span class="required-star">*</span>
          </label>
          <select class="form-select" id="currency" required onchange="onCurrencyChange()">
            <option value="VND" selected>🇻🇳 VND — Việt Nam Đồng</option>
            <option value="USD">🇺🇸 USD — Đô la Mỹ</option>
            <option value="SGD">🇸🇬 SGD — Đô la Singapore</option>
          </select>
        </div>

        <!-- 2. Phương thức nhận -->
        <div>
          <label class="form-label" for="method">
            Phương thức nhận <span class="required-star">*</span>
          </label>
          <select class="form-select" id="method" required>
            <option value="momo"><img class="method-icon" src="../images/momo.png" alt="MoMo"> MoMo</option>
            <option value="zalopay"><img class="method-icon" src="../images/zalopay.png" alt="ZaloPay"> ZaloPay</option>
            <option value="bank" selected><img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Chuyển khoản Ngân hàng</option>
            <option value="vietcombank">🏦 Vietcombank</option>
            <option value="techcombank">🏦 Techcombank</option>
            <option value="mbbank">🏦 MB Bank</option>
            <option value="acb">🏦 ACB</option>
          </select>
        </div>

        <!-- 3. Tên gợi nhớ -->
        <div>
          <label class="form-label" for="nickname">
            Tên gợi nhớ
          </label>
          <input type="text" class="form-control" id="nickname"
                 placeholder="Ví dụ: Ví MoMo của mẹ"
                 oninput="checkForm()"/>
          <div style="font-size:12px; color:var(--color-iron); margin-top:4px;">Tên để bạn dễ nhận ra, không bắt buộc</div>
        </div>

        <!-- 4. Tên chủ tài khoản -->
        <div>
          <label class="form-label" for="holder-name">
            Tên chủ tài khoản <span class="required-star">*</span>
          </label>
          <input type="text" class="form-control" id="holder-name"
                 placeholder="Nguyễn Thị Lan"
                 required oninput="checkForm()"/>
        </div>

        <!-- 5. Số điện thoại / Số tài khoản -->
        <div>
          <label class="form-label" for="account-number">
            Số điện thoại / Số tài khoản <span class="required-star">*</span>
          </label>
          <input type="text" class="form-control" id="account-number"
                 placeholder="+84 912 345 678 hoặc số tài khoản"
                 required oninput="checkForm()"/>
        </div>

        <!-- 6. Ghi chú -->
        <div>
          <label class="form-label" for="note">
            Ghi chú
          </label>
          <input type="text" class="form-control" id="note"
                 placeholder="Gia đình, bạn bè..."/>
          <div style="font-size:12px; color:var(--color-iron); margin-top:4px;">Không bắt buộc — dùng để ghi nhớ quan hệ</div>
        </div>

      </div>
    </form>

    <!-- Spacer -->
    <div style="height:20px;"></div>
  </div>

  <!-- STICKY BOTTOM CTA -->
  <div class="sticky-bottom">
    <div class="container-sm" style="max-width:480px;">
      <button class="btn btn-primary w-100" id="save-btn" disabled onclick="saveForm()" style="padding:14px;">
        <i class="bi bi-person-check me-2"></i>Lưu người thụ hưởng
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script src="mock-data.js"></script>
  <script src="components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    function onCurrencyChange() {
      var currency = document.getElementById('currency').value;
      var methodSelect = document.getElementById('method');

      // Clear existing options
      methodSelect.innerHTML = '';

      var options = [];
      if (currency === 'VND') {
        options = [
          { value: 'momo', label: '<img class="method-icon" src="../images/momo.png" alt="MoMo"> MoMo' },
          { value: 'zalopay', label: '<img class="method-icon" src="../images/zalopay.png" alt="ZaloPay"> ZaloPay' },
          { value: 'bank', label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Chuyển khoản Ngân hàng' },
          { value: 'vietcombank', label: '🏦 Vietcombank' },
          { value: 'techcombank', label: '🏦 Techcombank' },
          { value: 'mbbank', label: '🏦 MB Bank' },
          { value: 'acb', label: '🏦 ACB' },
        ];
      } else if (currency === 'USD') {
        options = [
          { value: 'zelle', label: '<img class="method-icon" src="../images/zelle.png" alt="Zelle"> Zelle' },
          { value: 'venmo', label: '<img class="method-icon" src="../images/venmo.png" alt="Venmo"> Venmo' },
          { value: 'paypal', label: '<img class="method-icon" src="../images/paypal.png" alt="PayPal"> PayPal' },
          { value: 'bank', label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer' },
        ];
      } else if (currency === 'SGD') {
        options = [
          { value: 'paynow', label: '💳 PayNow' },
          { value: 'bank', label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer' },
        ];
      }

      options.forEach(function(opt, i) {
        var el = document.createElement('option');
        el.value = opt.value;
        el.textContent = opt.label;
        if (i === 0) el.selected = true;
        methodSelect.appendChild(el);
      });

      // Update placeholder
      updatePlaceholder();
      checkForm();
    }

    function updatePlaceholder() {
      var method = document.getElementById('method').value;
      var input = document.getElementById('account-number');
      var label = input.previousElementSibling;
      if (method === 'momo' || method === 'zalopay') {
        input.placeholder = '+84 912 345 678';
        label.innerHTML = 'Số điện thoại <span class="required-star">*</span>';
      } else if (method === 'zelle' || method === 'applepay') {
        input.placeholder = '+1 (408) 555-0199';
        label.innerHTML = 'Số điện thoại <span class="required-star">*</span>';
      } else if (method === 'venmo') {
        input.placeholder = '@username';
        label.innerHTML = 'Username Venmo <span class="required-star">*</span>';
      } else if (method === 'paypal') {
        input.placeholder = 'email@example.com';
        label.innerHTML = 'Email PayPal <span class="required-star">*</span>';
      } else {
        input.placeholder = 'Nhập số tài khoản';
        label.innerHTML = 'Số tài khoản <span class="required-star">*</span>';
      }
    }

    document.getElementById('method').addEventListener('change', function() {
      updatePlaceholder();
      checkForm();
    });

    function checkForm() {
      var holderName = document.getElementById('holder-name').value.trim();
      var accountNumber = document.getElementById('account-number').value.trim();
      var currency = document.getElementById('currency').value;
      var method = document.getElementById('method').value;
      var isValid = holderName.length > 0 && accountNumber.length > 0 && currency && method;
      document.getElementById('save-btn').disabled = !isValid;
    }

    function saveForm() {
      showToast('Đã thêm người thụ hưởng!', 'success');
      setTimeout(function() {
        window.location.href = 's-27-beneficiaries.html';
      }, 1500);
    }

  </script>
</body>
</html>
