<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S-30 · Thêm tài khoản nhận tiền Provider — P2P Remit Deals</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    body { background: var(--color-cloud); }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--color-pebble);
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner { display: flex; align-items: center; gap: 12px; }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-slate);
      margin-bottom: 6px;
    }
    .form-control, .form-select {
      border: 1.5px solid var(--color-pebble) !important;
      border-radius: 12px !important;
      font-size: 15px;
      padding: 12px 14px;
      color: var(--color-ink);
      background: #fff;
      transition: border-color 0.15s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--color-monday-violet) !important;
      box-shadow: 0 0 0 3px rgba(97,97,255,0.12) !important;
    }

    .sticky-bottom {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--color-pebble);
      padding: 12px 16px;
      z-index: 200;
    }

    .required-star { color: var(--color-danger); margin-left: 2px; }

    .method-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--color-periwinkle);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 8px;
      font-size: 14px;
      color: var(--color-monday-violet);
      font-weight: 500;
    }

    .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <nav class="topbar">
    <div class="container-sm">
      <div class="topbar-inner">
        <a href="s-28-provider-accounts.html" class="btn btn-link p-0 text-decoration-none" style="color:var(--color-ink);">
          <i class="bi bi-arrow-left" style="font-size:20px;"></i>
        </a>
        <span style="font-weight:600; font-size:16px; color:var(--color-ink);">Thêm tài khoản nhận tiền</span>
      </div>
    </div>
  </nav>

  <!-- FORM -->
  <div class="container-sm py-3" style="max-width:480px;">
    <form id="provider-account-form" novalidate>
      <div class="d-flex flex-column gap-3">

        <!-- 1. Currency -->
        <div>
          <label class="form-label" for="currency">
            Tiền tệ <span class="required-star">*</span>
          </label>
          <select class="form-select" id="currency" required onchange="onCurrencyChange()">
            <option value="USD" selected>🇺🇸 USD — Đô la Mỹ</option>
            <option value="EUR">🇪🇺 EUR — Euro</option>
            <option value="SGD">🇸🇬 SGD — Đô la Singapore</option>
            <option value="VND">🇻🇳 VND — Việt Nam Đồng</option>
          </select>
        </div>

        <!-- 2. Method -->
        <div>
          <label class="form-label" for="method">
            Phương thức <span class="required-star">*</span>
          </label>
          <select class="form-select" id="method" required onchange="onMethodChange()">
            <option value="zelle" selected><img class="method-icon" src="../images/zelle.png" alt="Zelle"> Zelle</option>
            <option value="venmo"><img class="method-icon" src="../images/venmo.png" alt="Venmo"> Venmo</option>
            <option value="paypal"><img class="method-icon" src="../images/paypal.png" alt="PayPal"> PayPal</option>
            <option value="applepay"><img class="method-icon" src="../images/apple_cash.png" alt="Apple Cash"> Apple Cash</option>
            <option value="bank"><img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer</option>
          </select>
          <!-- Method preview -->
          <div class="method-preview" id="method-preview">
            <i class="bi bi-phone-fill"></i>
            <span id="method-hint">Nhập số điện thoại liên kết Zelle</span>
          </div>
        </div>

        <!-- 3. Tên gợi nhớ -->
        <div>
          <label class="form-label" for="nickname">
            Tên gợi nhớ
          </label>
          <input type="text" class="form-control" id="nickname"
                 placeholder="Ví dụ: Zelle chính"
                 oninput="checkForm()"/>
          <div style="font-size:12px; color:var(--color-iron); margin-top:4px;">Không bắt buộc — để nhận diện nhanh</div>
        </div>

        <!-- 4. Thông tin tài khoản (dynamic) -->
        <div>
          <label class="form-label" id="account-label">
            Số điện thoại <span class="required-star">*</span>
          </label>
          <input type="text" class="form-control" id="account-input"
                 placeholder="+1 (408) 555-0199"
                 required oninput="checkForm()"/>
        </div>

        <!-- 5. Tên chủ tài khoản -->
        <div>
          <label class="form-label" for="holder-name">
            Tên chủ tài khoản <span class="required-star">*</span>
          </label>
          <input type="text" class="form-control" id="holder-name"
                 placeholder="Nguyen Van B"
                 required oninput="checkForm()"/>
        </div>

        <!-- WARNING -->
        <div class="banner-warning">
          <div style="display:flex; gap:8px; align-items:flex-start;">
            <i class="bi bi-exclamation-triangle-fill mt-1 flex-shrink-0" style="color:var(--color-warning);"></i>
            <div>
              <strong>Lưu ý:</strong> Mỗi currency/method chỉ có 1 tài khoản active.
              Nếu đã có tài khoản cho USD/Zelle, hãy <strong>sửa tài khoản hiện có</strong> thay vì tạo mới.
            </div>
          </div>
        </div>

      </div>
    </form>

    <div style="height:20px;"></div>
  </div>

  <!-- STICKY BOTTOM CTA -->
  <div class="sticky-bottom">
    <div class="container-sm" style="max-width:480px;">
      <button class="btn btn-primary w-100" id="save-btn" disabled onclick="saveForm()" style="padding:14px;">
        <i class="bi bi-wallet2 me-2"></i>Lưu tài khoản
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <script src="mock-data.js"></script>
  <script src="components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script>
    var METHOD_CONFIG = {
      zelle:    { label: 'Số điện thoại', placeholder: '+1 (408) 555-0199', hint: 'Nhập số điện thoại liên kết Zelle', icon: 'bi-phone-fill' },
      venmo:    { label: 'Username (@handle)', placeholder: '@username', hint: 'Nhập @username Venmo của bạn', icon: 'bi-at' },
      paypal:   { label: 'Email PayPal', placeholder: 'email@example.com', hint: 'Nhập email đã đăng ký PayPal', icon: 'bi-envelope-fill' },
      applepay: { label: 'Số điện thoại', placeholder: '+1 (408) 555-0199', hint: 'Nhập số điện thoại Apple Cash', icon: 'bi-phone-fill' },
      bank:     { label: 'Số tài khoản', placeholder: 'XXXXXXXXXX', hint: 'Nhập số tài khoản ngân hàng', icon: 'bi-building-fill' },
      sepa:     { label: 'IBAN', placeholder: 'DE89370400440532013000', hint: 'Nhập IBAN ngân hàng SEPA', icon: 'bi-building-fill' },
      paynow:   { label: 'Số điện thoại / UEN', placeholder: '+65 9123 4567', hint: 'Nhập số điện thoại PayNow', icon: 'bi-phone-fill' },
      momo:     { label: 'Số điện thoại', placeholder: '+84 912 345 678', hint: 'Nhập số điện thoại MoMo', icon: 'bi-phone-fill' },
      zalopay:  { label: 'Số điện thoại', placeholder: '+84 912 345 678', hint: 'Nhập số điện thoại ZaloPay', icon: 'bi-phone-fill' },
    };

    var CURRENCY_METHODS = {
      USD: [
        { value: 'zelle',    label: '<img class="method-icon" src="../images/zelle.png" alt="Zelle"> Zelle' },
        { value: 'venmo',    label: '<img class="method-icon" src="../images/venmo.png" alt="Venmo"> Venmo' },
        { value: 'paypal',   label: '<img class="method-icon" src="../images/paypal.png" alt="PayPal"> PayPal' },
        { value: 'applepay', label: '<img class="method-icon" src="../images/apple_cash.png" alt="Apple Cash"> Apple Cash' },
        { value: 'bank',     label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer' },
      ],
      EUR: [
        { value: 'sepa',   label: '<img class="method-icon" src="../images/sepa.png" alt="SEPA"> SEPA Transfer' },
        { value: 'paypal', label: '<img class="method-icon" src="../images/paypal.png" alt="PayPal"> PayPal' },
        { value: 'bank',   label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer' },
      ],
      SGD: [
        { value: 'paynow', label: '💳 PayNow' },
        { value: 'bank',   label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer' },
      ],
      VND: [
        { value: 'momo',    label: '<img class="method-icon" src="../images/momo.png" alt="MoMo"> MoMo' },
        { value: 'zalopay', label: '<img class="method-icon" src="../images/zalopay.png" alt="ZaloPay"> ZaloPay' },
        { value: 'bank',    label: '<img class="method-icon" src="../images/bank-transfer.png" alt="Bank Transfer"> Bank Transfer' },
      ],
    };

    function onCurrencyChange() {
      var currency = document.getElementById('currency').value;
      var methodSelect = document.getElementById('method');
      methodSelect.innerHTML = '';

      var methods = CURRENCY_METHODS[currency] || CURRENCY_METHODS['USD'];
      methods.forEach(function(m, i) {
        var opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        if (i === 0) opt.selected = true;
        methodSelect.appendChild(opt);
      });

      onMethodChange();
    }

    function onMethodChange() {
      var method = document.getElementById('method').value;
      var config = METHOD_CONFIG[method] || METHOD_CONFIG['bank'];

      document.getElementById('account-label').innerHTML = config.label + ' <span class="required-star">*</span>';
      document.getElementById('account-input').placeholder = config.placeholder;

      var preview = document.getElementById('method-preview');
      preview.innerHTML = '<i class="bi ' + config.icon + '"></i><span>' + config.hint + '</span>';

      checkForm();
    }

    function checkForm() {
      var account = document.getElementById('account-input').value.trim();
      var holder = document.getElementById('holder-name').value.trim();
      var isValid = account.length > 0 && holder.length > 0;
      document.getElementById('save-btn').disabled = !isValid;
    }

    function saveForm() {
      showToast('Đã thêm tài khoản!', 'success');
      setTimeout(function() {
        window.location.href = 's-28-provider-accounts.html';
      }, 1500);
    }


    // Init
    onMethodChange();
  </script>
</body>
</html>
