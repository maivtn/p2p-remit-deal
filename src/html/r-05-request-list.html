<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R-05 · Yêu cầu của tôi — P2P Remit Deals</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <script src="mock-data.js"></script>
  <script src="components.js"></script>

  <style>
    body { background: var(--color-cloud); }

    .topbar { background:#fff; border-bottom:1px solid var(--color-pebble); padding:12px 0; position:sticky; top:0; z-index:100; }
    .topbar-inner { display:flex; align-items:center; gap:12px; }

    .bottom-nav { background:#fff; }

    /* Filter tabs */
    .filter-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    .filter-tabs::-webkit-scrollbar { display:none; }
    .filter-tab { border:1.5px solid var(--color-pebble); border-radius:var(--radius-buttons); padding:6px 16px; font-size:13px; font-weight:500; color:var(--color-slate); background:#fff; white-space:nowrap; cursor:pointer; flex-shrink:0; }
    .filter-tab.active { border-color:var(--color-monday-violet); background:var(--color-periwinkle); color:var(--color-monday-violet); }

    /* Request card */
    .request-card {
      background: #fff;
      border-radius: var(--radius-cards);
      border: 1px solid var(--color-mist);
      box-shadow: var(--shadow-xl);
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.15s;
    }
    .request-card:hover { border-color: var(--color-monday-violet); color: inherit; }

    .card-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }

    .corridor-flag { font-size:18px; }
    .corridor-arrow { color:var(--color-iron); font-size:13px; }

    .amount-send { font-size:18px; font-weight:700; color:var(--color-ink); font-variant-numeric:tabular-nums; }
    .amount-recv { font-size:15px; font-weight:600; color:var(--color-forest); font-variant-numeric:tabular-nums; }
    .method-chip { font-size:12px; color:var(--color-slate); background:var(--color-cloud); border-radius:var(--radius-buttons); padding:2px 10px; display:inline-flex; align-items:center; gap:4px; }

    .provider-avatar {
      width:32px; height:32px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700;
      flex-shrink:0;
    }

    .empty-state { text-align:center; color:var(--color-iron); padding:56px 24px; }
    .empty-state i { font-size:48px; opacity:0.4; display:block; margin-bottom:12px; }
  </style>
</head>
<body>

<!-- Topbar -->
<nav class="topbar">
  <div class="container-md">
    <div class="topbar-inner">
      <div style="font-size:22px;">💱</div>
      <div>
        <div style="font-size:16px; font-weight:700; color:var(--color-ink); line-height:1.1;">Yêu cầu của tôi</div>
        <div style="font-size:12px; color:var(--color-slate);">Theo dõi trạng thái chuyển tiền</div>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="badge-status badge-pending" id="active-count-badge" style="display:none;"></span>
        <button class="btn btn-primary" style="padding:8px 16px; font-size:13px;" onclick="window.location.href='r-02-send-request.html'">
          <i class="bi bi-plus-lg me-1"></i>Gửi mới
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Filter tabs -->
<div class="container-md pt-3 pb-2">
  <div class="filter-tabs" id="filter-tabs">
    <button class="filter-tab active" data-filter="active" onclick="setFilter('active', this)">Đang xử lý</button>
    <button class="filter-tab" data-filter="pending_acceptance" onclick="setFilter('pending_acceptance', this)">Chờ chấp nhận</button>
    <button class="filter-tab" data-filter="completed" onclick="setFilter('completed', this)">Hoàn tất</button>
    <button class="filter-tab" data-filter="cancelled" onclick="setFilter('cancelled', this)">Đã hủy</button>
    <button class="filter-tab" data-filter="expired" onclick="setFilter('expired', this)">Hết hạn</button>
    <button class="filter-tab" data-filter="disputed" onclick="setFilter('disputed', this)">Đã phân xử</button>
  </div>
</div>

<!-- Request list -->
<div class="container-md pb-3">
  <div class="d-flex flex-column gap-3" id="request-list"></div>
</div>

<!-- Bottom Nav -->

<!-- Toast -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
  // ── Status groupings ──
  const ACTIVE_STATUSES = ['pending_acceptance', 'accepted', 'payment_sent', 'payment_confirmed', 'transfer_sent'];
  const TERMINAL_STATUSES = ['completed', 'cancelled', 'expired', 'rejected', 'resolved', 'disputed'];

  // ── Detail page map ──
  const DETAIL_MAP = {
    pending_acceptance: 'r-06-detail-pending.html',
    accepted:           'r-07-detail-accepted.html',
    payment_sent:       'r-10-detail-payment-sent.html',
    payment_confirmed:  'r-11-detail-payment-confirmed.html',
    transfer_sent:      'r-12-detail-transfer-sent.html',
    completed:          'r-12-detail-transfer-sent.html',
    disputed:           'r-12-detail-transfer-sent.html',
    resolved:           'r-12-detail-transfer-sent.html',
    rejected:           'r-12-detail-transfer-sent.html',
    cancelled:          'r-12-detail-transfer-sent.html',
    expired:            'r-12-detail-transfer-sent.html',
  };

  // ── Sort priority for active statuses ──
  const STATUS_ORDER = {
    accepted: 0,
    payment_sent: 1,
    transfer_sent: 2,
    payment_confirmed: 3,
    pending_acceptance: 4,
  };

  // ── Provider name masking: show first name + last initial for non-completed ──
  function maskProviderName(req) {
    const terminal = ['completed', 'resolved'];
    const provider = P2P_DATA.getUser(req.providerId);
    if (!provider) return 'Provider';
    if (terminal.includes(req.status)) return provider.name;
    // First name + last initial
    const parts = provider.name.split(' ');
    if (parts.length <= 1) return parts[0];
    const last = parts[parts.length - 1];
    return parts.slice(0, parts.length - 1).join(' ') + ' ' + last.charAt(0) + '.';
  }

  // ── Countdown pill ──
  function countdownPill(req) {
    const deadline = req.t2Deadline || req.t1Deadline || req.t3Deadline || req.t4Deadline || req.t5Deadline;
    if (!deadline || !ACTIVE_STATUSES.includes(req.status)) return '';
    const cd = P2P_DATA.getCountdown(deadline);
    if (!cd || cd.isExpired) return '';
    const cls = cd.isUrgent ? 'urgent' : '';
    const label = P2P_DATA.formatCountdown(deadline);
    return `<span class="countdown ${cls}"><i class="bi bi-alarm me-1"></i>${label}</span>`;
  }

  // ── Action label for card CTA ──
  function actionLabel(status) {
    const map = {
      accepted: 'Chuyển tiền ngay',
      payment_sent: 'Xem bằng chứng',
      payment_confirmed: 'Xem chi tiết',
      transfer_sent: 'Xác nhận đã nhận',
      pending_acceptance: 'Xem chi tiết',
    };
    return map[status] || 'Xem chi tiết';
  }

  // ── Render single card ──
  function renderCard(req) {
    const provider = maskProviderName(req);
    const badgeClass = P2P_DATA.getStatusBadgeClass(req.status);
    const badgeLabel = P2P_DATA.getStatusLabel(req.status);
    const detailUrl = DETAIL_MAP[req.status] || 'r-05-request-list.html';
    const ago = P2P_DATA.timeAgo(req.createdAt);
    const sendAmount = P2P_DATA.formatAmount(req.amountSend, req.sendCurrency);
    const recvAmount = P2P_DATA.formatAmount(req.amountReceive, req.receiveCurrency);
    const sendCur = P2P_DATA.CURRENCIES ? (P2P_DATA.CURRENCIES.find(c => c.code === req.sendCurrency) || {flag:'🌐'}) : {flag:'🌐'};
    const recvCur = P2P_DATA.CURRENCIES ? (P2P_DATA.CURRENCIES.find(c => c.code === req.receiveCurrency) || {flag:'🌐'}) : {flag:'🌐'};

    // Determine method display
    const deal = P2P_DATA.getDeal(req.dealId);
    const methods = deal ? deal.methods : [];
    const methodText = methods.length >= 2
      ? `${P2P_DATA.getMethodIcon(methods[0])} ${P2P_DATA.getMethodLabel(methods[0])} → ${P2P_DATA.getMethodLabel(methods[methods.length-1])}`
      : methods.length === 1 ? `${P2P_DATA.getMethodIcon(methods[0])} ${P2P_DATA.getMethodLabel(methods[0])}` : '';

    const providerUser = P2P_DATA.getUser(req.providerId);
    const avatarBg = providerUser ? providerUser.avatarBg : '#e7ecff';
    const avatarColor = providerUser ? providerUser.avatarColor : '#6161ff';
    const initials = providerUser ? providerUser.initials : '??';
    const rating = providerUser && providerUser.rating ? `<span style="font-size:11px; color:var(--color-slate);"><i class="bi bi-star-fill" style="color:#f59e0b;"></i> ${providerUser.rating}</span>` : '';

    const cdPill = countdownPill(req);
    const isActive = ACTIVE_STATUSES.includes(req.status);
    const cta = isActive
      ? `<div class="mt-3"><span style="font-size:13px; font-weight:600; color:var(--color-monday-violet);">${actionLabel(req.status)} <i class="bi bi-arrow-right"></i></span></div>`
      : '';

    // Disputed / rejected / cancelled indicator
    let statusIcon = '';
    if (req.status === 'completed' || req.status === 'resolved') statusIcon = '<i class="bi bi-check-circle-fill" style="color:var(--color-forest); font-size:14px;"></i>';
    else if (['cancelled','rejected','expired'].includes(req.status)) statusIcon = '<i class="bi bi-x-circle-fill" style="color:var(--color-danger); font-size:14px;"></i>';
    else if (req.status === 'disputed') statusIcon = '<i class="bi bi-exclamation-circle-fill" style="color:var(--color-danger); font-size:14px;"></i>';

    return `
<a href="${detailUrl}" class="request-card">
  <!-- Row 1: Provider + status badge -->
  <div class="card-row mb-2">
    <div class="d-flex align-items-center gap-2">
      <div class="provider-avatar" style="background:${avatarBg}; color:${avatarColor};">${initials}</div>
      <div>
        <div style="font-size:14px; font-weight:600; color:var(--color-ink); line-height:1.2;">${provider}</div>
        ${rating}
      </div>
    </div>
    <div class="d-flex flex-column align-items-end gap-1">
      <span class="badge-status ${badgeClass}">${statusIcon ? statusIcon + ' ' : ''}${badgeLabel}</span>
      <span style="font-size:11px; color:var(--color-iron);">${ago}</span>
    </div>
  </div>

  <!-- Row 2: Corridor flags + amounts -->
  <div class="d-flex align-items-center gap-2 mb-2">
    <span class="corridor-flag">${sendCur.flag || '🌐'}</span>
    <span class="corridor-arrow"><i class="bi bi-arrow-right"></i></span>
    <span class="corridor-flag">${recvCur.flag || '🌐'}</span>
    <div class="ms-auto text-end">
      <div class="amount-send">${sendAmount}</div>
      <div class="amount-recv">${recvAmount}</div>
    </div>
  </div>

  <!-- Row 3: Method + countdown -->
  <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
    <span class="method-chip">${methodText}</span>
    <span style="font-size:11px; color:var(--color-iron);">ID: <code style="font-size:11px;">${req.id}</code></span>
    ${cdPill}
  </div>
  ${cta}
</a>`;
  }

  // ── Render list by filter ──
  let currentFilter = 'active';

  function getFilteredRequests(filter) {
    const all = P2P_DATA.getRequestsByUser('U-REQ-001', 'requester');

    let list;
    if (filter === 'active') {
      list = all.filter(r => ACTIVE_STATUSES.includes(r.status));
      // Sort: active statuses by priority, then by date desc
      list.sort((a, b) => {
        const ao = STATUS_ORDER[a.status] !== undefined ? STATUS_ORDER[a.status] : 99;
        const bo = STATUS_ORDER[b.status] !== undefined ? STATUS_ORDER[b.status] : 99;
        if (ao !== bo) return ao - bo;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });
    } else if (filter === 'disputed') {
      list = all.filter(r => r.status === 'disputed' || r.status === 'resolved');
      list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    } else {
      list = all.filter(r => r.status === filter);
      list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }
    return list;
  }

  function render() {
    const list = getFilteredRequests(currentFilter);
    const container = document.getElementById('request-list');

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="bi bi-inbox"></i>
          <div style="font-size:15px; font-weight:500; color:var(--color-slate); margin-bottom:4px;">Không có yêu cầu nào.</div>
          <div style="font-size:13px;">Bấm <strong>Gửi mới</strong> để tạo yêu cầu chuyển tiền.</div>
        </div>`;
      return;
    }

    container.innerHTML = list.map(renderCard).join('');
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  // ── Active count badge ──
  function updateActiveBadge() {
    const all = P2P_DATA.getRequestsByUser('U-REQ-001', 'requester');
    const activeCount = all.filter(r => ACTIVE_STATUSES.includes(r.status)).length;
    const badge = document.getElementById('active-count-badge');
    if (activeCount > 0) {
      badge.style.display = '';
      badge.textContent = activeCount + ' đang xử lý';
    }
  }

  // Init
  render();
  updateActiveBadge();
</script>

<script>P2P_COMPONENTS.renderBottomNav('requests');</script>
</body>
</html>
