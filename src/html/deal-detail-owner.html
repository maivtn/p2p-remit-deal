<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
  <title>Tìm deal</title>
  <title>Tìm Deal</title>
  <title>Chi tiết deal</title>
</head>

<body data-active-tab="manageDeals">
  <div class="app-shell">
    <header class="screen-toolbar blue">
      <a class="text-white text-decoration-none" href="deal-results.html"><i class="bi bi-chevron-left"></i> Quay lại
        kết quả</a>
      <h1 class="title">Chi tiết deal</h1>
    </header>

    <main class="app-page">
      <section class="deal-detail-hero">
        <div class="row g-3">
          <div class="col-md-4">
            <div class="deal-detail-rate">
              <div class="small-muted">Cặp tiền</div>
              <div id="dealPair">VND → USD</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="deal-detail-rate">
              <div class="small-muted">Giới hạn</div>
              <div id="dealAmount">$99 - $799</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="deal-detail-rate">
              <div class="small-muted">Tỷ giá</div>
              <div id="dealRate">1 USD = 25.500đ</div>
            </div>
          </div>
        </div>
      </section>

      <div class="desktop-grid">
        <div class="desktop-col-12">
          <section class="form-card">
            <h2 class="section-title mt-0">Thông tin thanh toán của deal</h2>
            <div id="dealMethods"></div>
          </section>
          <section class="form-card" id="cardAccountInfo"><h2 class="section-title mt-0">Tài khoản người thụ hưởng</h2><div id="dealAccountInfo"></div></section>
          <section class="form-card">
            <h2 class="section-title mt-0">Ghi chú của deal</h2>
            <p class="small-muted mb-0">Có thể thanh toán VND qua MoMo, ZaloPay hoặc chuyển khoản ngân hàng. Ưu tiên xử
              lý nhanh trong giờ hành chính.</p>
          </section>
        </div>

      </div>
    </main>
    <div class="tabs-wrap">
      <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/deal-detail.js"></script>
</body>

</html>
