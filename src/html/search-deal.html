<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<title>Tìm deal</title>
<title>Tìm Deal</title>
</head>
<body data-active-tab="searchDeals">
<div class="container">
<div class="app-shell">
  <div class="tabs-wrap">
    <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
  </div>

  <section class="overview-intro d-flex flex-column flex-lg-row align-items-start justify-content-between gap-3 mb-4 mt-3">
    <div class="title">
      <h1 class="overview-title">Tìm deal phù hợp</h1>
      <p class="overview-subtitle">Nhập nhu cầu chuyển tiền để lọc deal theo currency, method và hạn mức.</p>
    </div>
    <div class="overview-actions d-flex align-items-center gap-2">
    </div>
  </section>

  <main class="app-page">
    <div class="search-form-only">
      <section class="form-card">
        <label class="form-label">Tôi gửi bằng</label>
        <div class="row g-2">
          <div class="col-6">
            <select class="form-select currency-select">
              <option>🇺🇸 USD</option>
            </select>
          </div>
          <div class="col-6">
            <input class="form-control amount-input" value="500">
          </div>
        </div>
        <div class="rate-line">
          <span>1 USD ≈ 25.500đ</span>
          <i class="bi bi-info-circle" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Tỷ giá này chỉ là tạm thời. Tỷ giá thực tế sẽ phụ thuộc vào tỷ giá của deal hoặc thị trường tại thời điểm accept."></i>
        </div>

        <label class="form-label mt-3">Người thụ hưởng sẽ nhận bằng</label>
        <div class="row g-2">
          <div class="col-6">
            <select class="form-select currency-select">
              <option>🇻🇳 VND</option>
            </select>
          </div>
          <div class="col-6">
            <div class="convert-box">12.750.000đ</div>
          </div>
        </div>
      </section>

      <section class="form-card">
        <div class="form-label">Tôi gửi USD bằng hình thức</div>
        <div class="chips mb-3" id="senderUsdMethods"></div>

        <div class="form-label">Người thụ hưởng nhận VND bằng hình thức</div>
        <div class="chips" id="receiveVndMethods"></div>
      </section>
      <a class="btn btn-primary btn-lg w-100 mb-3" href="deal-results.html">
        <i class="bi bi-lightning-charge-fill"></i> Tìm Deal Phù Hợp
      </a>
    </div>
  </main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/search.js"></script>
</body>
</html>
