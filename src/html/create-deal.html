<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/css/theme.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<title>Tạo Deal Mới</title>
</head>
<body data-active-tab="manageDeals">
<div class="container">
<div class="app-shell">

  <div class="tabs-wrap">
    <nav class="deal-tabs" id="dealTabs" aria-label="Deal tabs"></nav>
  </div>

  <section class="overview-intro d-flex flex-column flex-lg-row align-items-start justify-content-between gap-3 mb-4 mt-3">
    <div class="overview-title-with-back">
      <a class="btn btn-outline-primary" href="manage-deals.html"><i class="bi bi-arrow-left"></i> Back</a>
      <div class="title">
      <h1 class="overview-title">Tạo Deal Mới</h1>
      <p class="overview-subtitle">Thiết lập tỷ giá, hạn mức và phương thức thanh toán để đăng deal mới.</p>
      </div>
    </div>
  </section>
  <main class="app-page"><div class="desktop-grid"><div class="desktop-col-5">
    <section class="form-card">
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label">
            Tôi gửi bằng
            <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Chọn loại tiền bạn sẽ gửi trong deal. Hệ thống dùng loại tiền này để hiển thị phương thức thanh toán phù hợp."></i>
          </label>
          <select class="form-select" id="createSenderCurrency"></select>
        </div>
        <div class="col-6">
          <label class="form-label">
            Thụ hưởng nhận qua
            <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Chọn loại tiền người thụ hưởng của bạn sẽ nhận. Các phương thức và tài khoản nhận sẽ được lọc theo loại tiền này."></i>
          </label>
          <select class="form-select" id="createBeneficiaryCurrency"></select>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <label class="form-label mb-0">
          <span id="createRateLabel">Tỷ giá (1 USD = ? VND)</span>
          <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Tỷ giá dùng để quy đổi giữa hai loại tiền trong deal. Có thể dùng tỷ giá thị trường hoặc nhập tỷ giá thủ công."></i>
        </label>
        <div class="form-check d-flex align-items-center gap-2 mb-0">
          <input class="form-check-input mt-0" type="checkbox" id="createMarketRateToggle">
          <label class="form-check-label small" for="createMarketRateToggle">Tỷ giá thị trường</label>
          <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Bật để hệ thống tự lấy tỷ giá thị trường theo cặp tiền đang chọn. Tắt để nhập tỷ giá thủ công."></i>
        </div>
      </div>
      <input class="form-control mt-2" id="createExchangeRateInput" inputmode="decimal">
      <div class="row g-3 mt-2">
        <div class="col-6">
          <label class="form-label">
            Tối thiểu ($)
            <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Số tiền USD nhỏ nhất mà bạn muốn nhận cho mỗi giao dịch được tạo từ deal này."></i>
          </label>
          <input class="form-control" value="99">
        </div>
        <div class="col-6">
          <label class="form-label">
            Tối đa ($)
            <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Số tiền USD lớn nhất mà bạn sẵn sàng xử lý cho mỗi giao dịch từ deal này."></i>
          </label>
          <input class="form-control" value="799">
        </div>
      </div>
    </section>

    </div><div class="desktop-col-7">
    <section class="method-panel green">
      <div class="panel-title green">
        <span id="createSenderMethodsTitle">Tôi gửi tiền VND bằng hình thức</span>
        <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Chọn các phương thức bạn có thể dùng để gửi tiền cho người thụ hưởng của đối tác. Có thể chọn nhiều phương thức."></i>
      </div>
      <div class="chips" id="createSenderVndMethods"></div>
    </section>
      <section class="method-panel blue">
      <div class="panel-title blue">
        <span id="createBeneficiaryMethodsTitle">Người thụ hưởng nhận USD bằng hình thức</span>
        <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Chọn phương thức người thụ hưởng của bạn sẽ dùng để nhận tiền từ đối tác. Phương thức này quyết định tài khoản cần chọn bên dưới."></i>
      </div>
      <div class="chips mb-3" id="createBeneficiaryUsdMethods" data-single="true"></div>
      <div class="panel-title blue">
        Thông tin tài khoản người thụ hưởng
        <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Tài khoản này là nơi người thụ hưởng của bạn nhận tiền. Chỉ các tài khoản khớp loại tiền và phương thức nhận đã chọn mới được hiển thị."></i>
      </div>
      <div id="createBeneficiaryAccount"></div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-outline-primary flex-fill" id="openCreateBeneficiaryAccountPicker" type="button">
          <i class="bi bi-person-check"></i> Chọn tài khoản
        </button>
        <button class="btn btn-primary flex-fill" data-account-modal data-mode="add" type="button">
          <i class="bi bi-plus"></i> Thêm mới
        </button>
      </div>
    </section>
<section class="form-card">
      <label class="form-label">
        Ghi chú
        <i class="bi bi-info-circle label-help-icon" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Thêm điều kiện hoặc lưu ý để người tìm deal biết trước khi gửi yêu cầu giao dịch."></i>
      </label>
      <textarea class="form-control" rows="4" placeholder="Điều kiện, lưu ý thêm..."></textarea>
    </section>

    <button class="btn btn-primary btn-lg w-100">Đăng Deal</button>
    </div></div>
  </main>


  <div class="modal fade" id="createBeneficiaryAccountPickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mx-auto" style="max-width:520px">
      <div class="modal-content accept-modal-card">
        <div class="modal-header">
          <div>
            <h5 class="modal-title fw-black">Chọn tài khoản người thụ hưởng</h5>
            <div class="small-muted" id="createAccountPickerSubtitle">Danh sách tài khoản phù hợp với phương thức đã chọn.</div>
          </div>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="createBeneficiaryAccountPickerList"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/create.js"></script>
</body>
</html>
