<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2P Remit — Starter Template</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/p2p-remit.css" rel="stylesheet">
</head>
<body class="p2p-body">
  <main class="p2p-container p2p-screen-shell">
    <section class="screen-hero">
      <div class="d-flex align-items-center justify-content-between position-relative z-1">
        <button class="btn btn-light rounded-circle"><i class="bi bi-arrow-left"></i></button>
        <h1 class="h3 fw-bold mb-0">Tên màn hình</h1>
        <button class="btn btn-light rounded-circle"><i class="bi bi-search"></i></button>
      </div>
    </section>

    <section class="screen-card">
      <div class="p2p-card p-4">
        <div class="p2p-panel-title"><span class="number">1</span>Section title</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Bạn gửi</label>
            <div class="input-group">
              <input class="form-control p2p-amount-input" value="500">
              <span class="input-group-text">🇺🇸 USD</span>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Bạn nhận</label>
            <div class="input-group">
              <input class="form-control p2p-amount-input text-success" value="12.750.000">
              <span class="input-group-text">🇻🇳 VND</span>
            </div>
          </div>
        </div>
        <button class="btn btn-p2p-primary w-100 mt-4">Primary action</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/p2p-remit.js"></script>
</body>
</html>
